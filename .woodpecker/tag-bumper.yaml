variables:
  - &jointhefreeworld_tag_bumper_image 'docker.io/jjba23/jointhefreeworld-woodpecker-tag-bumper:v0.1.12'
  - &jointhefreeworld_ssh_install_image 'docker.io/jjba23/jointhefreeworld-woodpecker-ssh-install:v0.1.12'
  - &jointhefreeworld_ssh_clone_image 'docker.io/jjba23/jointhefreeworld-woodpecker-ssh-clone:v0.1.12'

skip_clone: true

steps:
  ssh-install:
    image: *jointhefreeworld_ssh_install_image
    when:
      - event: [ "push" ]
        branch: [ "trunk" ]
    settings:
      GIT_SSH_AUTH:
        from_secret: "GIT_SSH_AUTH"  
            
  ssh-clone:
    image: *jointhefreeworld_ssh_clone_image
    when:
      - event: [ "push" ]
        branch: [ "trunk" ]     

  bump-repo-tag:
    image: *jointhefreeworld_tag_bumper_image
    when:
      - event: [ "push" ]
        branch: [ "trunk" ]

        
