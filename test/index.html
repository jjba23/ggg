<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>My Website</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main>
        <h1>GGG</h1>
        <div id="vector-image-container" style="display:flex;flex-direction:row;flex-wrap:wrap;gap:0.4rem;">
        </div>
    </main>
    <script>
      const vectorImages = ['scheme-guile', 'gnu-emacs', 'gnu-make', 'haskell-ghc910',
                           'pipeline-succeeded', 'scala-213', 'gnu-guix',
                            'license-lgpl3+', 'license-gpl3+', 'shell-fish',
                           'shell-eshell', 'license-agpl3+', 'license-fdl13+']

      document.addEventListener('DOMContentLoaded', () => {
          const vectorImageContainer = document.getElementById('vector-image-container')
          vectorImages.forEach(v => {
              const vectorImage = document.createElement('object')
              vectorImage.setAttribute('data', `../dist/${v}.svg`)
              vectorImageContainer.appendChild(vectorImage)
          })
      })
    </script>
  </body>
</html>
